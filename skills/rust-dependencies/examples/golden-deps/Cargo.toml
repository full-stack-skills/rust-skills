[package]
name = "golden-deps"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# Minimal: only what we need, narrow version requirement
serde = { version = "1", default-features = false, features = ["derive"] }

[dev-dependencies]
# Dev-only, won't appear in downstream's dep graph
serde_json = "1"
